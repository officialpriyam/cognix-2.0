# Render Blueprint — deploys the backend API from this monorepo.
# Apply with: render blueprint launch   (or via the Render dashboard "New +" → "Blueprint")
# Docs: https://render.com/docs/blueprint-spec
services:
  # Backend API: Next.js route handlers served as a long-running Node server.
  - type: web
    name: cognix-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    # Render injects $PORT; the start script binds Next.js to it.
    startCommand: pnpm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      # ⚠ Do NOT add NODE_ENV to this service (dashboard included).
      # Render injects NODE_ENV=production for web services; an ambient
      # NODE_ENV=development during `next build` bundles the development React
      # build and crashes static prerendering ("useContext" of null).
      # Frontend origin(s) that the backend will accept requests from.
      - key: NEXT_PUBLIC_ALLOWED_ORIGINS
        value: https://cognix.iampriyam.me
        sync: false
      # This service's own public URL, e.g. https://cognix-backend.onrender.com
      - key: NEXT_PUBLIC_API_URL
        sync: false
      # The backend's own public URL — used by better-auth to build trustedOrigins.
      # Must match how the frontend reaches the backend (scheme + hostname).
      - key: BETTER_AUTH_URL
        value: https://api.cognix.iampriyam.me
        sync: false
      # Must match the frontend's BETTER_AUTH_SECRET so cookies/signatures align.
      - key: BETTER_AUTH_SECRET
        value: mAtxoUfP3+croq0vBbd05mt8VjrkVVcde1qL9nFe5WI=
        sync: false
      # Supabase Postgres connection string (Project Settings -> Database -> Connection string -> URI).
      # Use the Session pooler URI and append ?sslmode=require (Supabase requires TLS).
      - key: POSTGRES_URL
        sync: false
      # Set to "true" to skip boot-time Drizzle migrations (instrumentation.ts) —
      # e.g. when you apply the schema yourself via `pnpm db:migrate`. Boot-time
      # migration failure aborts startup otherwise.
      - key: DISABLE_AUTO_MIGRATE
        sync: false
      # Upstash Redis URL (Console -> your database -> Connect -> ioredis).
      # Must use the rediss:// TLS scheme, e.g. rediss://default:<password>@<db>.upstash.io:6379
      - key: REDIS_URL
        sync: false
      # LLM provider keys (add only the ones you use)
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Exa AI - built-in web search tool (@web)
      - key: EXA_API_KEY
        sync: false
      # File storage (S3 or Vercel Blob)
      - key: FILE_STORAGE_TYPE
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
